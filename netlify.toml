[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist/spa"

[dev]
  command = "npm run dev"

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"

# API redirects
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/api/instagram-posts"
  to = "/.netlify/functions/instagram-posts"
  status = 200

# SPA routing - serve index.html for all non-API routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
